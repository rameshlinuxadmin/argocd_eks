apiVersion: v1
kind: Secret
metadata:
  name: local-eks
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    eks/localsetup: docker-desktop
  annotations:
    scm-home: https://github.com/rameshlinuxadmin/argocd_eks
stringData:
  name: local-eks
  server: https://kubernetes.default.svc
  config: |
    {
      "tlsClientConfig": {
        "insecure": false
      }
    }
