apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: north-south
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.slack: knot-notifications
spec:
  description: The North/South project contains tools which facilite traffic entering and exiting the cluster.
  sourceRepos:
    - "*"
  destinations:
    - namespace: ingress-nginx
      server: "*"
    - namespace: external-dns
      server: "*"
    - namespace: default
      server: "*"
    - namespace: cert-manager
      server: "*"
    - namespace: kube-system
      server: "*"
    - namespace: envoy-gateway
      server: "*"
    - namespace: envoy-gateway
      server: "*"
    - namespace: argocd
      server: "*"
    - namespace: default
      server: "*"
    - namespace: argorollouts
      server: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
    - group: elbv2.k8s.aws
      kind: IngressClassParams
    - group: gateway.networking.k8s.io
      kind: GatewayClass