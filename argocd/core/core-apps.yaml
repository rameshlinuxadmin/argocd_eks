apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core-apps
  namespace: argocd
  labels:
    enterprise/app: core-apps
spec:
  project: default
  source:
    repoURL: https://github.com/rameshlinuxadmin/argocd_eks
    targetRevision: HEAD
    path: argocd/core-apps
    directory:
      recurse: true
      exclude: '{.*,**/.*/**}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
    